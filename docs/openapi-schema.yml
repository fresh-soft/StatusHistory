openapi: 3.0.2
info:
  title: Status History
  description: Инструмент для хранения и анализа истории изменения статусов сервисов.
  version: 0.1.0

paths:
  /api/services/:
    get:
      tags:
        - Сервисы
      summary: Список сервисов
      description: Возвращает полный список всех зарегистрированных сервисов.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
    post:
      tags:
        - Сервисы
      summary: Создание сервиса
      description: Регистрирует новый сервис в системе.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description]
              properties:
                name:
                  type: string
                  example: 'Крутой сервис'
                description:
                  type: string
                  example: 'Описание крутого сервиса'
                status:
                  type: string
                  enum: ['работает', 'не работает', 'нестабильно']
                  default: 'работает'
      responses:
        '201':
          description: Сервис создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"

  /api/history/{service_id}/:
    get:
      tags:
        - История
      summary: История изменений сервиса
      description: Возвращает лог всех изменений состояния конкретного сервиса по его ID.
      parameters:
        - name: service_id
          in: path
          required: true
          schema:
            type: integer
          example: 3
      responses:
        '200':
          description: Список изменений
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/History'

  /api/{service_id}/{start_date}/{end_date}/:
    get:
      tags:
        - SLA
      operationId: calculateSla
      summary: Расчёт SLA
      description: Вычисляет процент доступности и общее время простоя за период.
      parameters:
        - name: service_id
          in: path
          required: true
          schema:
            type: integer
        - name: start_date
          in: path
          required: true
          schema:
            type: string
            format: date
          example: '2023-10-29'
        - name: end_date
          in: path
          required: true
          schema:
            type: string
            format: date
          example: '2023-11-13'
      responses:
        '200':
          description: Данные по SLA
          content:
            application/json:
              schema:
                type: object
                properties:
                  service_name:
                    type: string
                    example: 'Fourth'
                  sla_percentage:
                    type: number
                    format: float
                    example: 96.913
                  total_downtime:
                    type: string
                    example: '0 месяцев, 1 дней, 10 часов, 12 минут, 31 секунд'

components:
  schemas:
    Service:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        name:
          type: string
          maxLength: 100
          example: 'СAPI2'
        status:
          type: string
          example: 'работает'
        description:
          type: string
          example: 'Крутой сервис'
    
    History:
      type: object
      properties:
        id:
          type: integer
          example: 1
        service_id:
          type: integer
          example: 3
        status:
          type: string
          example: 'работает'
        last_modified:
          type: string
          format: date-time
          example: "2023-11-12T12:05:52Z"